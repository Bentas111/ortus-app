# Codemagic — budowanie iOS bez Maca i wysyłka do App Store Connect (TestFlight).
# Wymaga w Codemagic: 1) integracji App Store Connect (klucz API z konta Apple Developer),
# 2) włączonego automatycznego podpisywania (App Store Connect → certyfikaty i profile
#    tworzy Codemagic sam), 3) Bundle ID pl.niekazmuliczyc.ortus zarejestrowanego w Apple Developer.
workflows:
  ios-app-store:
    name: Ortuś iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ortus ASC            # nazwa integracji ustawiona w Codemagic → Teams → Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pl.niekazmuliczyc.ortus
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Zależności npm (pliki gry www/ są w repozytorium — build.js uruchamia się lokalnie)
        script: |
          npm ci
      - name: Capacitor sync + CocoaPods
        script: |
          npx cap sync ios
          cd ios/App && pod install
      - name: Profile podpisywania
        script: |
          xcode-project use-profiles
      - name: Numer wersji z App Store Connect
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Budowanie .ipa
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-play:
    name: Ortuś Android → plik .aab
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
      # klucz podpisu: Codemagic → Teams → Code signing identities → Android keystore (nazwa: ortus_keystore)
      android_signing:
        - ortus_keystore
    scripts:
      - name: Zależności npm (pliki gry www/ są w repozytorium — build.js uruchamia się lokalnie)
        script: |
          npm ci
          npx cap sync android
      - name: Budowanie .aab
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab

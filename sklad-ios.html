<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  #board{width:1290px;height:2796px;background:linear-gradient(180deg,#F1E9FF 0%,#F6F0FA 46%,#FFF8F0 100%);display:flex;flex-direction:column;align-items:center;overflow:hidden}
  #head{width:1110px;height:450px;padding:90px 0 0;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:center}
  #head span{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:104px;line-height:1.14;color:#573AC0;text-align:center;text-wrap:balance}
  #frame{width:1050px;height:2226px;flex:none;background:#fff;border:6px solid #DCCFF6;border-radius:60px;box-shadow:0 26px 60px rgba(87,58,192,.14);box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#FFF8F0}
  #frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
</style>
</head>
<body>
<div id="board">
  <div id="head"><span id="txt"></span></div>
  <div id="frame"><img id="shot" alt=""></div>
</div>
<script>
  const HASLA = [
    "Ortografia bez wkuwania regułek",
    "13 trybów ćwiczeń, klasy 1–6",
    "360 dyktand czytanych na głos",
    "Reguła po każdej odpowiedzi",
    "Punkty, passa i 44 odznaki",
    "Panel dla rodzica: co dziecko umie"
  ];
  const n = +(new URLSearchParams(location.search).get("n") || 1);
  document.getElementById("txt").textContent = HASLA[n - 1];
  document.getElementById("shot").src = "ios-" + n + ".png?v=" + Date.now();
  window.gotowe = false;
  Promise.all([document.fonts.ready, new Promise(r => { const i = document.getElementById("shot"); i.complete ? r() : (i.onload = r, i.onerror = r); })])
    .then(() => setTimeout(() => { window.gotowe = true; }, 300));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  .duszek{display:block}
</style>
</head>
<body>

<!-- IKONA 512×512: biały duszek na pełnym fiolecie -->
<div id="ikona" style="width:512px;height:512px;background:#F1E9FF;display:flex;align-items:center;justify-content:center;overflow:hidden">
  <svg width="300" height="336" viewBox="0 0 100 112" class="duszek">
    <path d="M14,54 C14,29 32,10 50,10 C68,10 86,29 86,54 L86,92 C86,99 79,101 74,96 L69,91 C66,88 61,88 58,91 L54,95 C51,98 49,98 46,95 L42,91 C39,88 34,88 31,91 L26,96 C21,101 14,99 14,92 Z" fill="#6C4BD6"/>
    <ellipse cx="40" cy="34" rx="17" ry="11" fill="#FFFFFF" opacity="0.16"/>
    <ellipse cx="38" cy="50" rx="9" ry="11" fill="#FFFFFF"/>
    <ellipse cx="62" cy="50" rx="9" ry="11" fill="#FFFFFF"/>
    <circle cx="39" cy="52" r="4.4" fill="#2C2447"/>
    <circle cx="63" cy="52" r="4.4" fill="#2C2447"/>
    <circle cx="40.6" cy="50.4" r="1.5" fill="#FFFFFF"/>
    <circle cx="64.6" cy="50.4" r="1.5" fill="#FFFFFF"/>
    <ellipse cx="29" cy="64" rx="6" ry="4" fill="#E9A8C9"/>
    <ellipse cx="71" cy="64" rx="6" ry="4" fill="#E9A8C9"/>
    <path d="M42,70 Q50,78 58,70" fill="none" stroke="#2C2447" stroke-width="3.2" stroke-linecap="round"/>
  </svg>
</div>

<!-- BANER 1024×500 -->
<div id="baner" style="width:1024px;height:500px;background:radial-gradient(circle at 12% 6%, #F1E9FF 0%, #F7F1FF 42%, #FFF8F0 100%);display:flex;align-items:center;justify-content:space-between;gap:44px;padding:44px 64px;box-sizing:border-box;overflow:hidden;font-family:'Nunito',sans-serif">
  <div style="display:flex;flex-direction:column;justify-content:center;flex:0 0 396px">
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:112px;line-height:1;color:#573AC0;letter-spacing:-1px">Ortuś</div>
    <div style="font-weight:700;font-size:30px;color:#6B6285;margin-top:10px;line-height:1.25">ortografia dla klas 1–6</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:26px">
      <div style="background:#fff;border:2px solid #DCCFF6;border-radius:999px;padding:10px 20px;font-weight:800;font-size:20px;color:#573AC0">ó czy u?</div>
      <div style="background:#fff;border:2px solid #DCCFF6;border-radius:999px;padding:10px 20px;font-weight:800;font-size:20px;color:#573AC0">rz czy ż?</div>
      <div style="background:#fff;border:2px solid #DCCFF6;border-radius:999px;padding:10px 20px;font-weight:800;font-size:20px;color:#573AC0">nie razem czy osobno?</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:22px;flex:none">
    <svg width="150" height="168" viewBox="0 0 100 112" class="duszek" style="flex:none">
      <path d="M14,54 C14,29 32,10 50,10 C68,10 86,29 86,54 L86,92 C86,99 79,101 74,96 L69,91 C66,88 61,88 58,91 L54,95 C51,98 49,98 46,95 L42,91 C39,88 34,88 31,91 L26,96 C21,101 14,99 14,92 Z" fill="#6C4BD6"/>
      <ellipse cx="40" cy="34" rx="17" ry="11" fill="#FFFFFF" opacity="0.16"/>
      <ellipse cx="38" cy="50" rx="9" ry="11" fill="#FFFFFF"/>
      <ellipse cx="62" cy="50" rx="9" ry="11" fill="#FFFFFF"/>
      <circle cx="39" cy="52" r="4.4" fill="#2C2447"/>
      <circle cx="63" cy="52" r="4.4" fill="#2C2447"/>
      <circle cx="40.6" cy="50.4" r="1.5" fill="#FFFFFF"/>
      <circle cx="64.6" cy="50.4" r="1.5" fill="#FFFFFF"/>
      <ellipse cx="29" cy="64" rx="6" ry="4" fill="#E9A8C9"/>
      <ellipse cx="71" cy="64" rx="6" ry="4" fill="#E9A8C9"/>
      <path d="M42,70 Q50,78 58,70" fill="none" stroke="#2C2447" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <div style="background:#fff;border:3px solid #DCCFF6;border-radius:24px;padding:22px 24px;box-shadow:0 14px 30px rgba(44,36,72,.10);flex:none">
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:50px;line-height:1;color:#2C2447;text-align:center;letter-spacing:1px">ż<span style="color:#6C4BD6">_</span>łw</div>
      <div style="display:flex;gap:12px;margin-top:18px;justify-content:center">
        <div style="display:flex;align-items:center;gap:7px;background:#157A43;border-radius:14px;padding:11px 18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;color:#fff;line-height:1">ó
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
        </div>
        <div style="background:#fff;border:3px solid #DCCFF6;border-radius:14px;padding:11px 26px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;color:#573AC0;line-height:1">u</div>
      </div>
    </div>
  </div>
</div>

<script>
  window.gotowe = false;
  document.fonts.ready.then(() => setTimeout(() => { window.gotowe = true; }, 300));
</script>
</body>
</html>
